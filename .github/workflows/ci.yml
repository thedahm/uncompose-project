name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this one as its gate, so "the full suite passed"
  # and "CI passed" can never mean two different things.
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build the manylinux wheel
        run: uvx maturin build --release --out dist
      - name: Smoke-test the installed binary
        run: ci/smoke-wheel.sh dist

  release-checks:
    # The guards the release workflow puts in front of `publish` — a tag that
    # disagrees with the source version, a wheel that isn't the one the tag
    # names. Seconds, no toolchain, so they are gated on every change rather
    # than discovered at a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ci/release-checks.test.sh
