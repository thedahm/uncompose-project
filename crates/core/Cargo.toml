[package]
name = "uncompose-project-core"
description = "Core library owning manifest semantics for uncompose-project."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps opaque `ext`/derivation object keys in their on-disk order,
# so a read-modify-write carries a third party's subtree through verbatim (uncompose#64).
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ulid = "1"
time = { version = "0.3", features = ["formatting"] }
# flock(2) for the mutating-command sidecar lock (ADR-0011). v0.1 is Linux-only,
# which is what makes the advisory lock a safe, universal choice.
libc = "0.2"
# Validates imported comparison records against the vendored compare v0 schema
# (ADR-0012) — the same crate, and the same schema bytes, `uncompose-compare`
# validates with when it writes the record.
# default-features off drops the HTTP/file `$ref` resolvers (and reqwest/tokio with
# them): the schema is embedded and self-contained, and a local-first tool has no
# business fetching a schema over the network mid-import.
jsonschema = { version = "0.26", default-features = false }

[dev-dependencies]
tempfile = "3"
